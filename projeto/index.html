<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/script.js" type="module"></script>
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=lock,content_copy,refresh" />
    <title>Password Generator</title>
</head>

<body>

    <header>
        <span class="material-symbols-outlined" id="icone1">lock</span>
        Gerador de senhas
    </header>

    <main>
        <div class="card">

            <div class="gerar">
                <input type="text" readonly placeholder="Clique em gerar senha..." name="senha" id="senha">
                <span class="material-symbols-outlined" id="copy">content_copy</span>
            </div>

            <div class="metrica">
                <span class="med"></span>
                <span class="med"></span>
                <span class="med"></span>
                <p id="medidor">
                    Força: <span class="valor">—</span>
                </p>
            </div>

            <div class="tam-senha">
                <div class="texto">
                    <p>Tamanho da senha</p>
                    <div class="variavel">
                        <p id="quantidade">8 </p>
                        <p>caracteres</p>
                    </div>
                </div>
                <input type="range" min="8" max="64" value="16" id="slider">
            </div>

            <div class="lista">
                <ul>
                    <li>
                        <label for="letrasMai">Letras maiúsculas (A-Z)</label>
                        <input type="checkbox" id="letrasMai">
                    </li>
                    <li>
                        <label for="letrasMin">Letras minúsculas (a-z)</label>
                        <input type="checkbox" id="letrasMin">
                    </li>
                    <li>
                        <label for="num">Números (0-9)</label>
                        <input type="checkbox" id="num">
                    </li>
                    <li>
                        <label for="simbolos">Símbolos (!@#$%...)</label>
                        <input type="checkbox" id="simbolos">
                    </li>
                </ul>
            </div>

            <div class="botaoSenha">
                <button class="buttonS" id="btnGerar">
                    <span class="material-symbols-outlined">refresh</span>
                    Gerar senha
                </button>
            </div>

            <div class="historico">
                <p>Últimas senhas geradas</p>

                <ul id="lista-historico">
                </ul>
            </div>

        </div>
    </main>

    <footer>
        <p>Feito por Daniel de Oliveira Colonheze</p>
        <p>Usando HTML, CSS e JS puro</p>
    </footer>

</body>

</html>
